<script>
var credentialPool = [{"name":"클라스","id":"sj862918","pw":"highball1"},{"name":"김현일","id":"hyunil1305","pw":"highball1"},{"name":"김현주","id":"sad0913","pw":"highball486"},{"name":"김진솔","id":"artkk0307","pw":"highball7!"},{"name":"유준호","id":"osmcart","pw":"highball9!"},{"name":"최우영","id":"bmewoo","pw":"dndud7327@"},{"name":"신태호","id":"taehoshin","pw":"taehoshin93!"},{"name":"신태호","id":"wjdqhdms121","pw":"tennis0328"},{"name":"최수정","id":"pch454961","pw":"pch58233692!"},{"name":"최수정","id":"tnwjdqkfoa87","pw":"pch454962!"},{"name":"송정철","id":"guqdls12","pw":"abc7634!!"},{"name":"원태형","id":"mylifeings","pw":"xogud0309!"}];

function byClass(cls){
  return document.getElementsByClassName(cls);
}

function selectAll(cls, checked){
  var list = byClass(cls);
  for(var i=0;i<list.length;i++) list[i].checked = checked;
  refreshSelected();
}

function refreshSelected(){
  var items = document.getElementsByClassName('item');
  for(var i=0;i<items.length;i++){
    var input = items[i].getElementsByTagName('input')[0];
    items[i].className = input && input.checked ? 'item selected' : 'item';
    if(items[i].className.indexOf('member-item')>=0) {
      if(input && input.checked) items[i].className += ' member-item';
    }
  }
}

function checkedValues(cls){
  var list = byClass(cls), arr=[];
  for(var i=0;i<list.length;i++) if(list[i].checked) arr.push(list[i].value);
  return arr;
}

function hasCredential(name){
  for(var i=0;i<credentialPool.length;i++) if(credentialPool[i].name===name) return true;
  return false;
}

function getCredential(name, useCount){
  var arr=[];
  for(var i=0;i<credentialPool.length;i++) if(credentialPool[i].name===name) arr.push(credentialPool[i]);
  if(arr.length===0) return {id:'',pw:''};
  return arr[useCount % arr.length];
}

function generateSchedule(){
  var members = checkedValues('memberChk');
  var courts = checkedValues('courtChk');
  var times = checkedValues('timeChk');
  var maxHours = parseInt(document.getElementById('maxHours').value,10);
  var priority = document.getElementById('idPriority').checked;
  var mode = document.getElementById('mode').value;

  if(members.length===0){ alert('참여 회원을 선택해주세요.'); return; }
  if(courts.length===0){ alert('코트를 선택해주세요.'); return; }
  if(times.length===0){ alert('시간을 선택해주세요.'); return; }

  var counts={}, credUse={}, rows=[], usedAtTime={};
  for(var m=0;m<members.length;m++) counts[members[m]]=0;

  for(var t=0;t<times.length;t++){
    usedAtTime[times[t]]={};
    for(var c=0;c<courts.length;c++){
      var candidates=[];
      for(var m2=0;m2<members.length;m2++){
        var name=members[m2];
        if(counts[name] < maxHours && !usedAtTime[times[t]][name]) candidates.push(name);
      }

      if(priority){
        var idCandidates=[];
        for(var x=0;x<candidates.length;x++) if(hasCredential(candidates[x])) idCandidates.push(candidates[x]);
        if(idCandidates.length>0) candidates=idCandidates;
      }

      if(candidates.length===0){
        rows.push([courts[c],times[t],'미배정','','']);
        continue;
      }

      if(mode==='random'){
        candidates.sort(function(){return Math.random()-0.5;});
      } else {
        candidates.sort(function(a,b){
          if(counts[a]!==counts[b]) return counts[a]-counts[b];
          var ai=hasCredential(a)?0:1, bi=hasCredential(b)?0:1;
          if(priority && ai!==bi) return ai-bi;
          return a.localeCompare(b,'ko');
        });
      }

      var pick=candidates[0];
      counts[pick]++;
      usedAtTime[times[t]][pick]=true;
      if(!credUse[pick]) credUse[pick]=0;
      var cred=getCredential(pick,credUse[pick]);
      credUse[pick]++;
      rows.push([courts[c],times[t],pick,cred.id,cred.pw]);
    }
  }

  var tb=document.getElementById('tbody');
  tb.innerHTML='';
  for(var r=0;r<rows.length;r++){
    var tr=document.createElement('tr');
    for(var k=0;k<5;k++){
      var td=document.createElement('td');
      td.appendChild(document.createTextNode(rows[r][k]));
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  }
  document.getElementById('summary').innerHTML =
    '선택 회원 <b>'+members.length+'명</b> · 코트 <b>'+courts.length+'개</b> · 시간 <b>'+times.length+'개</b> · 총 슬롯 <b>'+rows.length+'개</b>';
}

function clearSchedule(){
  document.getElementById('tbody').innerHTML='';
  document.getElementById('summary').innerHTML='';
}

function init(){
  var status=document.getElementById('jsStatus');
  status.innerHTML='✅ 버튼 기능 정상 작동 중';
  status.style.background='#ecfdf3';
  status.style.color='#027a48';

  var inputs=document.getElementsByTagName('input');
  for(var i=0;i<inputs.length;i++){
    inputs[i].onchange=refreshSelected;
  }
  refreshSelected();
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
} else {
  init();
}
</script>
